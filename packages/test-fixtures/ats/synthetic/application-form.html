<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ExampleCo Software Engineer Application</title>
  </head>
  <body>
    <main>
      <h1>Software Engineer — ExampleCo</h1>
      <form>
        <label>First name <input name="first_name" autocomplete="given-name" /></label>
        <label>Last name <input name="last_name" autocomplete="family-name" /></label>
        <label>Email <input name="email" type="email" autocomplete="email" /></label>
        <label>Resume <input name="resume" type="file" accept=".pdf,.docx" /></label>
        <fieldset>
          <legend>Will you now or in the future require employment sponsorship?</legend>
          <label><input type="radio" name="sponsorship" value="yes" /> Yes</label>
          <label><input type="radio" name="sponsorship" value="no" /> No</label>
        </fieldset>
        <label>
          <input name="attestation" type="checkbox" />
          I certify that the information in this application is truthful.
        </label>
        <button type="submit">Submit application</button>
      </form>
    </main>
  </body>
</html>
