name: Publish gateway Lambda artifact

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Isolated AWS/GitHub Environment receiving the immutable artifact
        required: true
        default: development
        type: choice
        options:
          - development
          - staging

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    concurrency:
      group: publish-${{ inputs.environment }}-gateway-lambda
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.24.0
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.12.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ai-job-apply/gateway... build
      - run: pnpm --filter @ai-job-apply/gateway test
      - run: pnpm audit:dependencies

      - name: Build reproducible artifact and CycloneDX SBOM
        id: artifact
        shell: bash
        env:
          ARTIFACT_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          pnpm --filter @ai-job-apply/gateway build:lambda
          first_sha="$(jq -r .artifactSha256 backend/gateway/dist/lambda/gateway-lambda.manifest.json)"
          pnpm --filter @ai-job-apply/gateway build:lambda
          second_sha="$(jq -r .artifactSha256 backend/gateway/dist/lambda/gateway-lambda.manifest.json)"
          test "$first_sha" = "$second_sha"
          test "$(jq -r .schemaVersion backend/gateway/dist/lambda/gateway-lambda.manifest.json)" = "2"
          test "$(jq -r .sourceSha backend/gateway/dist/lambda/gateway-lambda.manifest.json)" = "$GITHUB_SHA"
          test "$(jq -r .bomFormat backend/gateway/dist/lambda/gateway-lambda.cdx.json)" = "CycloneDX"
          test "$(jq -r .specVersion backend/gateway/dist/lambda/gateway-lambda.cdx.json)" = "1.6"
          base64_sha="$(jq -r .artifactBase64Sha256 backend/gateway/dist/lambda/gateway-lambda.manifest.json)"
          echo "sha256=$second_sha" >> "$GITHUB_OUTPUT"
          echo "base64_sha256=$base64_sha" >> "$GITHUB_OUTPUT"

      - name: Require configured environment publishing boundary
        env:
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: test -n "$ARTIFACT_BUCKET" && test -n "$AWS_DEPLOY_ROLE_ARN"

      - name: Obtain short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2
          role-session-name: publish-${{ inputs.environment }}-gateway-lambda-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Verify private versioned artifact bucket
        env:
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws s3api get-bucket-versioning --bucket "$ARTIFACT_BUCKET" --query Status --output text)" = "Enabled"
          test "$(aws s3api get-bucket-encryption --bucket "$ARTIFACT_BUCKET" --query 'ServerSideEncryptionConfiguration.Rules[0].ApplyServerSideEncryptionByDefault.SSEAlgorithm' --output text)" = "aws:kms"
          public_block="$(aws s3api get-public-access-block --bucket "$ARTIFACT_BUCKET" --query 'PublicAccessBlockConfiguration.[BlockPublicAcls,IgnorePublicAcls,BlockPublicPolicy,RestrictPublicBuckets]' --output text)"
          test "$public_block" = $'True\tTrue\tTrue\tTrue'

      - name: Publish immutable release evidence
        id: publish
        env:
          ARTIFACT_BASE64_SHA256: ${{ steps.artifact.outputs.base64_sha256 }}
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
          ARTIFACT_SHA256: ${{ steps.artifact.outputs.sha256 }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          prefix="lambda/gateway/$SOURCE_SHA/$ARTIFACT_SHA256"
          artifact_key="$prefix/gateway-lambda.zip"
          for release_key in \
            "$artifact_key" \
            "$prefix/gateway-lambda.cdx.json" \
            "$prefix/gateway-lambda.manifest.json" \
            "$prefix/gateway-lambda.sha256"; do
            if aws s3api head-object --bucket "$ARTIFACT_BUCKET" --key "$release_key" >/dev/null 2>&1; then
              echo "An immutable artifact/evidence key already exists; refusing to create another object version." >&2
              exit 1
            fi
          done
          artifact_result="$(aws s3api put-object \
            --bucket "$ARTIFACT_BUCKET" \
            --key "$artifact_key" \
            --body backend/gateway/dist/lambda/gateway-lambda.zip \
            --checksum-algorithm SHA256 \
            --checksum-sha256 "$ARTIFACT_BASE64_SHA256" \
            --metadata "source-sha=$SOURCE_SHA,artifact-sha256=$ARTIFACT_SHA256" \
            --output json)"
          version_id="$(jq -r .VersionId <<<"$artifact_result")"
          test -n "$version_id" && test "$version_id" != "null"

          for evidence in gateway-lambda.cdx.json gateway-lambda.manifest.json gateway-lambda.sha256; do
            evidence_key="$prefix/$evidence"
            aws s3api put-object \
              --bucket "$ARTIFACT_BUCKET" \
              --key "$evidence_key" \
              --body "backend/gateway/dist/lambda/$evidence" \
              --metadata "source-sha=$SOURCE_SHA,artifact-sha256=$ARTIFACT_SHA256" \
              >/dev/null
          done

          echo "artifact_key=$artifact_key" >> "$GITHUB_OUTPUT"
          echo "object_version=$version_id" >> "$GITHUB_OUTPUT"

      - name: Publish sanitized deployment inputs
        env:
          ARTIFACT_BASE64_SHA256: ${{ steps.artifact.outputs.base64_sha256 }}
          ARTIFACT_KEY: ${{ steps.publish.outputs.artifact_key }}
          ARTIFACT_SHA256: ${{ steps.artifact.outputs.sha256 }}
          OBJECT_VERSION: ${{ steps.publish.outputs.object_version }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        shell: bash
        run: |
          {
            echo "### Gateway Lambda artifact"
            echo
            echo "- Environment: \`$TARGET_ENVIRONMENT\`"
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo "- S3 key: \`$ARTIFACT_KEY\`"
            echo "- S3 object version: \`$OBJECT_VERSION\`"
            echo "- SHA-256: \`$ARTIFACT_SHA256\`"
            echo "- Base64 SHA-256: \`$ARTIFACT_BASE64_SHA256\`"
            echo "- Dependency audit: passed at High severity with exact documented mobile-build exceptions"
            echo "- CycloneDX SBOM: published beside the artifact"
            echo "- Deployment/traffic change: none"
          } >> "$GITHUB_STEP_SUMMARY"
