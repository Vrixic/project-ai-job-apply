name: Publish workflow Lambda artifacts

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Isolated AWS/GitHub Environment receiving the immutable artifacts
        required: true
        default: development
        type: choice
        options:
          - development
          - staging

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    concurrency:
      group: publish-${{ inputs.environment }}-workflow-lambdas
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.24.0
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.12.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ai-job-apply/workflows... build
      - run: pnpm --filter @ai-job-apply/workflows test
      - run: pnpm audit:dependencies

      - name: Build reproducible artifacts and CycloneDX SBOMs
        id: artifact
        shell: bash
        env:
          ARTIFACT_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          artifact_dir="backend/workflows/dist/lambda"
          names=(workflow-ingress-lambda profile-readiness-durable-lambda profile-readiness-activity-lambda ingestion-durable-lambda ingestion-runtime-lambda)

          pnpm --filter @ai-job-apply/workflows build:lambda
          for name in "${names[@]}"; do
            test "$(jq -r .schemaVersion "$artifact_dir/$name.manifest.json")" = "2"
            test "$(jq -r .sourceSha "$artifact_dir/$name.manifest.json")" = "$GITHUB_SHA"
            unzip -p "$artifact_dir/$name.zip" index.mjs > "/tmp/$name.index.mjs"
            grep -Fq "/* applydash-artifact-source:$GITHUB_SHA */" "/tmp/$name.index.mjs"
            jq -r .artifactSha256 "$artifact_dir/$name.manifest.json" > "/tmp/$name.first-sha"
          done

          pnpm --filter @ai-job-apply/workflows build:lambda
          for name in "${names[@]}"; do
            first_sha="$(<"/tmp/$name.first-sha")"
            second_sha="$(jq -r .artifactSha256 "$artifact_dir/$name.manifest.json")"
            test "$first_sha" = "$second_sha"
            test "$(jq -r .sourceSha "$artifact_dir/$name.manifest.json")" = "$GITHUB_SHA"
            test "$(jq -r .bomFormat "$artifact_dir/$name.cdx.json")" = "CycloneDX"
            test "$(jq -r .specVersion "$artifact_dir/$name.cdx.json")" = "1.6"
          done

      - name: Require configured environment publishing boundary
        env:
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: test -n "$ARTIFACT_BUCKET" && test -n "$AWS_DEPLOY_ROLE_ARN"

      - name: Obtain short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2
          role-session-name: publish-${{ inputs.environment }}-workflow-lambdas-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Verify private versioned artifact bucket
        env:
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws s3api get-bucket-versioning --bucket "$ARTIFACT_BUCKET" --query Status --output text)" = "Enabled"
          test "$(aws s3api get-bucket-encryption --bucket "$ARTIFACT_BUCKET" --query 'ServerSideEncryptionConfiguration.Rules[0].ApplyServerSideEncryptionByDefault.SSEAlgorithm' --output text)" = "aws:kms"
          public_block="$(aws s3api get-public-access-block --bucket "$ARTIFACT_BUCKET" --query 'PublicAccessBlockConfiguration.[BlockPublicAcls,IgnorePublicAcls,BlockPublicPolicy,RestrictPublicBuckets]' --output text)"
          test "$public_block" = $'True\tTrue\tTrue\tTrue'

      - name: Publish immutable release evidence
        id: publish
        env:
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="backend/workflows/dist/lambda"
          names=(workflow-ingress-lambda profile-readiness-durable-lambda profile-readiness-activity-lambda ingestion-durable-lambda ingestion-runtime-lambda)
          output_names=(ingress durable activity ingestion_durable ingestion_runtime)

          for index in "${!names[@]}"; do
            name="${names[$index]}"
            output_name="${output_names[$index]}"
            sha256="$(jq -r .artifactSha256 "$artifact_dir/$name.manifest.json")"
            base64_sha256="$(jq -r .artifactBase64Sha256 "$artifact_dir/$name.manifest.json")"
            prefix="lambda/workflows/$SOURCE_SHA/$sha256"
            artifact_key="$prefix/$name.zip"

            for release_key in \
              "$artifact_key" \
              "$prefix/$name.cdx.json" \
              "$prefix/$name.manifest.json" \
              "$prefix/$name.sha256"; do
              if aws s3api head-object --bucket "$ARTIFACT_BUCKET" --key "$release_key" >/dev/null 2>&1; then
                echo "An immutable artifact/evidence key already exists; refusing to create another object version." >&2
                exit 1
              fi
            done

            artifact_result="$(aws s3api put-object \
              --bucket "$ARTIFACT_BUCKET" \
              --key "$artifact_key" \
              --body "$artifact_dir/$name.zip" \
              --checksum-algorithm SHA256 \
              --checksum-sha256 "$base64_sha256" \
              --metadata "source-sha=$SOURCE_SHA,artifact-sha256=$sha256" \
              --output json)"
            version_id="$(jq -r .VersionId <<<"$artifact_result")"
            test -n "$version_id" && test "$version_id" != "null"

            for suffix in cdx.json manifest.json sha256; do
              aws s3api put-object \
                --bucket "$ARTIFACT_BUCKET" \
                --key "$prefix/$name.$suffix" \
                --body "$artifact_dir/$name.$suffix" \
                --metadata "source-sha=$SOURCE_SHA,artifact-sha256=$sha256" \
                >/dev/null
            done

            echo "${output_name}_key=$artifact_key" >> "$GITHUB_OUTPUT"
            echo "${output_name}_object_version=$version_id" >> "$GITHUB_OUTPUT"
            echo "${output_name}_sha256=$sha256" >> "$GITHUB_OUTPUT"
            echo "${output_name}_base64_sha256=$base64_sha256" >> "$GITHUB_OUTPUT"
          done

      - name: Publish sanitized deployment inputs
        env:
          ACTIVITY_BASE64_SHA256: ${{ steps.publish.outputs.activity_base64_sha256 }}
          ACTIVITY_KEY: ${{ steps.publish.outputs.activity_key }}
          ACTIVITY_OBJECT_VERSION: ${{ steps.publish.outputs.activity_object_version }}
          ACTIVITY_SHA256: ${{ steps.publish.outputs.activity_sha256 }}
          DURABLE_BASE64_SHA256: ${{ steps.publish.outputs.durable_base64_sha256 }}
          DURABLE_KEY: ${{ steps.publish.outputs.durable_key }}
          DURABLE_OBJECT_VERSION: ${{ steps.publish.outputs.durable_object_version }}
          DURABLE_SHA256: ${{ steps.publish.outputs.durable_sha256 }}
          INGRESS_BASE64_SHA256: ${{ steps.publish.outputs.ingress_base64_sha256 }}
          INGRESS_KEY: ${{ steps.publish.outputs.ingress_key }}
          INGRESS_OBJECT_VERSION: ${{ steps.publish.outputs.ingress_object_version }}
          INGRESS_SHA256: ${{ steps.publish.outputs.ingress_sha256 }}
          INGESTION_DURABLE_BASE64_SHA256: ${{ steps.publish.outputs.ingestion_durable_base64_sha256 }}
          INGESTION_DURABLE_KEY: ${{ steps.publish.outputs.ingestion_durable_key }}
          INGESTION_DURABLE_OBJECT_VERSION: ${{ steps.publish.outputs.ingestion_durable_object_version }}
          INGESTION_DURABLE_SHA256: ${{ steps.publish.outputs.ingestion_durable_sha256 }}
          INGESTION_RUNTIME_BASE64_SHA256: ${{ steps.publish.outputs.ingestion_runtime_base64_sha256 }}
          INGESTION_RUNTIME_KEY: ${{ steps.publish.outputs.ingestion_runtime_key }}
          INGESTION_RUNTIME_OBJECT_VERSION: ${{ steps.publish.outputs.ingestion_runtime_object_version }}
          INGESTION_RUNTIME_SHA256: ${{ steps.publish.outputs.ingestion_runtime_sha256 }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        shell: bash
        run: |
          {
            echo "### Workflow Lambda artifacts"
            echo
            echo "- Environment: \`$TARGET_ENVIRONMENT\`"
            echo "- Source commit: \`$GITHUB_SHA\`"
            for label in INGRESS DURABLE ACTIVITY INGESTION_DURABLE INGESTION_RUNTIME; do
              key_variable="${label}_KEY"
              version_variable="${label}_OBJECT_VERSION"
              sha_variable="${label}_SHA256"
              base64_variable="${label}_BASE64_SHA256"
              echo "- ${label,,} S3 key: \`${!key_variable}\`"
              echo "- ${label,,} S3 object version: \`${!version_variable}\`"
              echo "- ${label,,} SHA-256: \`${!sha_variable}\`"
              echo "- ${label,,} Base64 SHA-256: \`${!base64_variable}\`"
            done
            echo "- Dependency audit: passed at High severity with exact documented mobile-build exceptions"
            echo "- CycloneDX SBOMs: published beside each artifact"
            echo "- Deployment/trigger change: none"
          } >> "$GITHUB_STEP_SUMMARY"
