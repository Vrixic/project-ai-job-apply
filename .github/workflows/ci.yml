name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://ai_job_apply:local_only@localhost:55439/ai_job_apply
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_DB: ai_job_apply
          POSTGRES_USER: ai_job_apply
          POSTGRES_PASSWORD: local_only
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U ai_job_apply -d ai_job_apply"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.24.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Gateway and workspace dependencies for catalog replay
        run: pnpm --filter @ai-job-apply/gateway... build
      - name: Verify D1-004 catalog invariants
        run: pnpm verify:d1-004-catalog-invariants
      - name: Verify catalog-invariant orchestration
        shell: pwsh
        run: ./scripts/tests/d1-004-catalog-invariants.tests.ps1

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.24.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.12.0
          cache: pnpm
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:generate
      - name: Verify generated contracts are current
        run: git diff --exit-code -- packages/api-contracts/generated
      - run: pnpm skills:validate
      - run: pnpm infrastructure:validate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Validate Compose
        run: docker compose config --quiet

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    strategy:
      matrix:
        include:
          - name: migration
            dockerfile: Dockerfile.migration
          - name: web
            dockerfile: Dockerfile.web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Resolve checked-out source epoch
        id: source_epoch
        shell: bash
        run: |
          source_epoch="$(git show -s --format=%ct HEAD)"
          [[ "$source_epoch" =~ ^[0-9]+$ ]]
          printf 'value=%s\n' "$source_epoch" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.name == 'migration' && format('SOURCE_DATE_EPOCH={0}', steps.source_epoch.outputs.value) || '' }}
          push: false
          tags: ai-job-apply/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    env:
      DATABASE_URL: postgres://ai_job_apply:local_only@localhost:55432/ai_job_apply
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.24.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:generate
      - run: docker compose up -d --wait postgres
      - run: pnpm test:integration
      - if: always()
        run: docker compose down --volumes

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.24.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.12.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:dependencies
