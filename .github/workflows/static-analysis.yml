name: Static analysis

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check out pinned Semgrep rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: semgrep/semgrep-rules
          ref: 81634cfc9e68dc5f238a8062909a60ba34500648
          path: .semgrep-rules
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install pinned Semgrep
        run: python -m pip install --disable-pip-version-check semgrep==1.172.0
      - name: Scan executable and infrastructure source
        run: |
          semgrep scan \
            --config .semgrep-rules/javascript/lang/security \
            --config .semgrep-rules/typescript/nestjs/security \
            --config .semgrep-rules/terraform/aws \
            --config .semgrep-rules/dockerfile/security \
            --config .semgrep-rules/yaml/github-actions \
            --severity ERROR \
            --severity WARNING \
            --metrics=off \
            --error \
            backend \
            frontend \
            packages \
            infrastructure/terraform \
            .github/workflows \
            Dockerfile.migration \
            Dockerfile.web
