name: Publish environment images

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Isolated AWS/GitHub Environment to publish into
        required: true
        default: development
        type: choice
        options:
          - development
          - staging

permissions:
  contents: read

jobs:
  publish:
    name: Publish migration
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    concurrency:
      group: publish-${{ inputs.environment }}-migration
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_NAME: migration
      REPOSITORY: ai-job-apply/migration
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require configured deployment role
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: test -n "$AWS_DEPLOY_ROLE_ARN"

      - name: Obtain short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2
          role-session-name: publish-${{ inputs.environment }}-migration-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Verify immutable encrypted repository
        run: |
          set -euo pipefail
          settings="$(aws ecr describe-repositories \
            --repository-names "$REPOSITORY" \
            --query 'repositories[0].[imageTagMutability,imageScanningConfiguration.scanOnPush,encryptionConfiguration.encryptionType]' \
            --output text)"
          test "$settings" = $'IMMUTABLE\tTrue\tKMS'

      - name: Sign in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push commit image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.migration
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.environment }}-migration
          cache-to: type=gha,mode=max,scope=${{ inputs.environment }}-migration

      - name: Wait for ECR scan and enforce severity gate
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          index_manifest="$(aws ecr batch-get-image \
            --repository-name "$REPOSITORY" \
            --image-ids "imageTag=$SOURCE_SHA" \
            --accepted-media-types application/vnd.oci.image.index.v1+json \
            --query 'images[0].imageManifest' \
            --output text)"
          mapfile -t platform_digests < <(
            jq -r \
              '.manifests[]
                | select(.platform.os == "linux" and .platform.architecture == "amd64")
                | .digest' <<<"$index_manifest"
          )
          if [[ "${#platform_digests[@]}" -ne 1 ]]; then
            echo "Expected exactly one linux/amd64 image in the published index." >&2
            exit 1
          fi
          platform_digest="${platform_digests[0]}"

          scan_status=""
          for attempt in $(seq 1 60); do
            scan_status="$(aws ecr describe-image-scan-findings \
              --repository-name "$REPOSITORY" \
              --image-id "imageDigest=$platform_digest" \
              --query 'imageScanStatus.status' \
              --output text 2>/dev/null || true)"
            case "$scan_status" in
              COMPLETE) break ;;
              FAILED|UNSUPPORTED_IMAGE)
                echo "ECR image scan ended with status $scan_status." >&2
                exit 1
                ;;
            esac
            sleep 10
          done
          test "$scan_status" = "COMPLETE"

          findings="$(aws ecr describe-image-scan-findings \
            --repository-name "$REPOSITORY" \
            --image-id "imageDigest=$platform_digest" \
            --output json)"
          critical="$(jq -r '.imageScanFindings.findingSeverityCounts.CRITICAL // 0' <<<"$findings")"
          high="$(jq -r '.imageScanFindings.findingSeverityCounts.HIGH // 0' <<<"$findings")"

          {
            echo "### $IMAGE_NAME image"
            echo
            echo "- Environment: \`$TARGET_ENVIRONMENT\`"
            echo "- Source commit: \`$SOURCE_SHA\`"
            echo "- Immutable index digest: \`$IMAGE_DIGEST\`"
            echo "- Scanned linux/amd64 digest: \`$platform_digest\`"
            echo "- ECR scan: complete"
            echo "- Critical findings: $critical"
            echo "- High findings: $high"
          } >> "$GITHUB_STEP_SUMMARY"

          test "$critical" -eq 0
          test "$high" -eq 0
