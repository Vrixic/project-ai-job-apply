version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      workspace:
        patterns: ["*"]
    ignore:
      # TypeScript 7 (the native compiler) has no JavaScript compiler API, which openapi-typescript
      # and other tooling need. Re-enable once the contract generator supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directory: /infrastructure/terraform
    schedule:
      interval: weekly
